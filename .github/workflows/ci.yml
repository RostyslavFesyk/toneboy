name: macOS checks

on:
  push:
    branches: [main, "experiment/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: DSP and lifecycle tests
        run: bash test-stability.sh
      - name: Release build
        run: bash build.sh
      - name: Audit main app
        run: bash verify-public-api.sh
      - name: Build public-API sandbox probe
        run: bash build-sandbox-probe.sh
      - name: Audit sandbox probe
        run: bash verify-sandbox-probe.sh
